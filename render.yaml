services:
  - type: web
    runtime: docker
    name: careguard-api
    plan: starter
    region: singapore
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health/ready
    preDeployCommand: python /app/migrate.py
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: careguard-db
          property: connectionString
      - key: MIGRATION_DIR
        value: /migrations
      - key: ALLOWED_ORIGINS
        value: https://careguard-web.onrender.com
      - key: ALLOWED_HOSTS
        value: careguard-api.onrender.com,*.onrender.com
      - key: ENABLE_API_DOCS
        value: "false"
      - key: DEMO_ACCESS_TOKEN
        generateValue: true
      - key: AI_MODE
        value: fixture

  - type: web
    runtime: static
    name: careguard-web
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_BASE_URL
        value: https://careguard-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: careguard-db
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "16"
    databaseName: careguard
    user: careguard
    ipAllowList: []
