name: careguard-ci

on:
  push:
    branches: [main, test-main, "feat/**", "feature/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: careguard
          POSTGRES_USER: careguard
          POSTGRES_PASSWORD: careguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careguard -d careguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://careguard:careguard@localhost:5432/careguard
      ENCOUNTER_TEST_DATABASE_URL: postgresql://careguard:careguard@localhost:5432/careguard?connect_timeout=5
      MIGRATION_DIR: db/migrations
      AI_MODE: fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Apply migrations from an empty database
        run: python backend/migrate.py
      - name: Run backend and integration tests
        run: python -m unittest discover -s tests -v
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Validate Compose configurations
        env:
          APP_DOMAIN: demo.example.com
          POSTGRES_PASSWORD: ci-only-password
          DEMO_ACCESS_TOKEN: ci-only-access-token
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
      - name: Build production images
        run: |
          docker build -f backend/Dockerfile -t careguard-api:ci .
          docker build -f frontend/Dockerfile --target production -t careguard-web:ci frontend
