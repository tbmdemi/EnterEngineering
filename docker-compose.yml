services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: careguard
      POSTGRES_USER: careguard
      POSTGRES_PASSWORD: careguard
    ports: ["5432:5432"]
    volumes:
      - dental_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Check the same TCP listener used by other containers. During first-time
      # initialization Postgres briefly accepts local socket connections before
      # restarting, which must not release the migration job early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U careguard -d careguard"]
      interval: 2s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://careguard:careguard@db:5432/careguard
      MIGRATION_DIR: /migrations
    volumes:
      - ./db/migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "/app/migrate.py"]
    restart: "no"
  demo-reset:
    profiles: ["tools"]
    image: postgres:16-alpine
    environment:
      PGPASSWORD: careguard
    volumes:
      - ./db/demo:/demo:ro
      - ./db/migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "psql -v ON_ERROR_STOP=1 -h db -U careguard -d careguard -f /demo/reset_scenarios.sql && psql -v ON_ERROR_STOP=1 -h db -U careguard -d careguard -f /migrations/002_demo_scenarios.sql"]
    restart: "no"
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://careguard:careguard@db:5432/careguard
      AI_MODE: fixture
    ports: ["8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
  web:
    build:
      context: ./frontend
      target: production
    environment:
      API_PROXY_TARGET: http://api:8000
    ports: ["8080:80"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  dental_data:
